          <p class="voice-pull">„Für mich eine wirklich gelungene Fortbildung mit hohem Praxisnutzen.“</p>
          <blockquote>
            <p>Ich habe am Intensivkurs „Kinesiologisches Taping“ mit Thorsten Büscher am PhysioCampus Dortmund teilgenommen und kann den Kurs absolut weiterempfehlen.</p>
            <p>Besonders gut fand ich die Kombination aus verständlich vermittelter Theorie und sehr viel Praxis. Thorsten schafft es, die verschiedenen Tape-Techniken nicht einfach nur zu zeigen, sondern auch zu erklären, wann und warum man sie sinnvoll einsetzen kann. Man merkt sofort, dass er über sehr viel Erfahrung aus der Physiotherapie und dem Sport verfügt und die Inhalte selbst täglich in der Praxis anwendet.</p>
            <p>Trotz des umfangreichen Programms war der Kurs kurzweilig, praxisnah und sehr angenehm aufgebaut. Es gab genügend Zeit zum eigenen Üben, für individuelle Fragen und für direkte Korrekturen. Viele der gezeigten Techniken kann man anschließend unmittelbar bei Patienten einsetzen.</p>
            <p>Wer kinesiologisches Taping fundiert lernen oder seine bisherigen Kenntnisse erweitern möchte, ist bei Thorsten genau richtig.</p>
          </blockquote>
