        <figure class="voice voice-main">
          <p class="voice-kicker">Inhouse-Fortbildung · medTrain, Leobersdorf (Österreich)</p>
          <p class="voice-pull">„Eine klare Empfehlung für Praxen und Therapeut:innen, die Fortbildungen suchen, aus denen man nicht nur neue Ideen, sondern wirklich direkt anwendbares Wissen für die tägliche Arbeit mitnimmt.“</p>
          <blockquote>
            <p>Wir hatten bereits zuvor einen Dry-Needling-Kurs mit Thorsten Büscher gebucht und waren sowohl fachlich als auch von seiner Art der Vermittlung absolut begeistert. Deshalb war für uns schnell klar, dass wir auch einen weiteren Intensivkurs mit ihm durchführen möchten.</p>
            <p>Für unser Team in Leobersdorf hat Thorsten anschließend einen eintägigen Intensivkurs zum Thema Functional Training und Training an Geräten durchgeführt. Auch dieser Fortbildungstag hat unsere Erwartungen voll erfüllt. Besonders gut gefallen hat uns die Kombination aus fundiertem Fachwissen, sehr viel praktischer Anwendung und der direkten Übertragbarkeit in den therapeutischen Alltag.</p>
            <p>Thorsten schafft es, auch komplexere Trainingsinhalte verständlich, praxisnah und mit vielen konkreten Beispielen zu vermitteln. Dabei geht es nicht einfach nur um einzelne Übungen, sondern vor allem darum, Training sinnvoll aufzubauen, zu variieren und individuell an Patient:innen und unterschiedliche Leistungsniveaus anzupassen.</p>
            <p>Die Atmosphäre während des gesamten Tages war ausgesprochen angenehm, lebendig und kollegial. Fragen aus unserem Team wurden jederzeit aufgegriffen und direkt praktisch umgesetzt. Genau diese Mischung aus hoher fachlicher Kompetenz, langjähriger Erfahrung und unkomplizierter Vermittlung macht seine Kurse für uns besonders wertvoll.</p>
            <p>Nach den sehr positiven Erfahrungen mit beiden Fortbildungen freuen wir uns umso mehr, die Zusammenarbeit mit Thorsten künftig weiter auszubauen und gemeinsam auch offene Fortbildungen zu diesen Themen anzubieten.</p>
          </blockquote>
          <figcaption><b>Anne Sass</b><span>medTrain, Leobersdorf, Österreich · Inhouse-Kurse Dry Needling sowie Functional Training und Training an Geräten</span></figcaption>
        </figure>
        <div class="voice-grid">
          <figure class="voice">
            <blockquote><p>Ich habe am Intensivkurs „Kinesiologisches Taping“ mit Thorsten Büscher am PhysioCampus Dortmund teilgenommen und kann den Kurs absolut weiterempfehlen.</p></blockquote>
            <figcaption><b>Teilnehmer:in</b><span>Intensivkurs „Kinesiologisches Taping“ · PhysioCampus Dortmund</span></figcaption>
          </figure>
          <figure class="voice">
            <blockquote><p>Besonders gut fand ich die Kombination aus verständlich vermittelter Theorie und sehr viel Praxis. Thorsten schafft es, die verschiedenen Tape-Techniken nicht einfach nur zu zeigen, sondern auch zu erklären, wann und warum man sie sinnvoll einsetzen kann. Man merkt sofort, dass er über sehr viel Erfahrung aus der Physiotherapie und dem Sport verfügt und die Inhalte selbst täglich in der Praxis anwendet.</p></blockquote>
            <figcaption><b>Teilnehmer:in</b><span>Kurs „Kinesiologisches Taping“</span></figcaption>
          </figure>
          <figure class="voice">
            <blockquote><p>Trotz des umfangreichen Programms war der Kurs kurzweilig, praxisnah und sehr angenehm aufgebaut. Es gab genügend Zeit zum eigenen Üben, für individuelle Fragen und für direkte Korrekturen. Viele der gezeigten Techniken kann man anschließend unmittelbar bei Patienten einsetzen.</p></blockquote>
            <figcaption><b>Teilnehmer:in</b><span>Kurs „Kinesiologisches Taping“</span></figcaption>

          <figure class="voice">
