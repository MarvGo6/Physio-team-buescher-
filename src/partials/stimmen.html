    <!-- STIMMEN -->
    <section class="sec voices" id="stimmen">
      <div class="wrap">
        <p class="sec-tag"><span class="tape">Stimmen</span></p>
        <h2 class="h2">Was Teilnehmende sagen</h2>

        <!--
          REZENSIONEN PFLEGEN:
          Nur echte, freigegebene Rückmeldungen eintragen (Name/Funktion nur mit Einverständnis).
          Für jede echte Rezension: Klasse "is-placeholder" entfernen, Zitat und Angaben ersetzen
          und das <span class="ph-flag"> löschen.
        -->
        <div class="voice-grid">
          <figure class="voice is-placeholder">
            <span class="ph-flag">Platzhalter</span>
            <blockquote><p>Hier steht die Rückmeldung einer Teilnehmerin oder eines Teilnehmers. Zum Beispiel, was am meisten für die eigene Arbeit gebracht hat.</p></blockquote>
            <figcaption><b>Vorname N.</b><span>Physiotherapeut:in, Ort</span></figcaption>
          </figure>
          <figure class="voice is-placeholder">
            <span class="ph-flag">Platzhalter</span>
            <blockquote><p>Platz für eine zweite echte Rezension, gern zu den praktischen Inhalten wie Taping, Dry Needling oder Return to Sport.</p></blockquote>
            <figcaption><b>Vorname N.</b><span>Klinik oder Verein</span></figcaption>
          </figure>
          <figure class="voice is-placeholder">
            <span class="ph-flag">Platzhalter</span>
            <blockquote><p>Platz für die Rückmeldung einer Akademie oder Fortbildungsschule, die den Kurs bereits angeboten hat.</p></blockquote>
            <figcaption><b>Name</b><span>Akademie, Ort</span></figcaption>
          </figure>
        </div>
        <p class="voice-note">Sie waren im Kurs? <a href="mailto:@@EMAIL@@?subject=Feedback%20zum%20Kurs%20Sportphysiotherapie%20neu%20gedacht">Schicken Sie mir Ihr Feedback.</a></p>
      </div>
    </section>
